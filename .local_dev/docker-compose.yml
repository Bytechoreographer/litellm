# Local dev stack for LiteLLM proxy: Postgres (matches dev server 15.10) + Redis.
# Usage:  docker compose -f .local_dev/docker-compose.yml up -d
services:
  postgres:
    image: artifactory.momenta.works/docker/postgres:15-alpine
    container_name: litellm-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: litellm_dev
    ports:
      - "5432:5432"
    volumes:
      - litellm_pg_data:/var/lib/postgresql/data

  redis:
    image: artifactory.momenta.works/docker/redis:7-alpine
    container_name: litellm-redis
    ports:
      - "6379:6379"

volumes:
  litellm_pg_data:
